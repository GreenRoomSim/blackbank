<style>
:root{--bg:#070708;--card:#111114;--ink:#f4f1ea;--mute:#8d8a82;--line:#2a2a2e;--accent:#c9a24b;--ok:#6fcf97;--bad:#e0897a}

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px 64px;background:#0b0b0d;border-bottom:1px solid var(--line)}
.brand{font-family:Georgia,serif;letter-spacing:6px}.brand small{letter-spacing:3px;color:var(--accent);font-size:.65rem;margin-left:8px;text-transform:uppercase}
.who{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.8rem}
.tabs{display:flex;gap:4px;padding:0 14px 0 64px;background:#0b0b0d;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:5}
.tabs a{padding:13px 14px;color:var(--mute);text-decoration:none;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;border-bottom:2px solid transparent;white-space:nowrap}

.tile,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}

button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#0b0b0c;font-weight:600}
button.ghost,button.sm{background:transparent;color:var(--accent);border:1px solid var(--line)}button.sm{padding:5px 10px;font-size:.78rem}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}button:disabled,input:disabled{opacity:.4;cursor:default}

a.item{display:block;color:inherit;text-decoration:none}a.item:hover strong{color:var(--accent)}
.back{color:var(--mute);text-decoration:none;font-size:.85rem;display:inline-block;margin-bottom:10px}
.sub{color:var(--mute);margin:-8px 0 16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1b1b1f;border:1px solid var(--accent);padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}

.kick{letter-spacing:4px;text-transform:uppercase;font-size:.68rem;color:var(--accent);margin-bottom:6px}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.9rem}.mrow span{color:var(--mute)}.mrow strong{text-align:right}
.mbad{color:var(--bad);margin:10px 0;font-size:.9rem}
.ack{display:flex;gap:10px;align-items:center;margin:14px 0}.ack input{width:auto}

<script>window.addEventListener("error",function(e){var d=document.createElement("div");d.style.cssText="padding:24px;color:#e0a89c;font-family:system-ui;line-height:1.5";d.textContent="This page couldn't load: "+(e.message||"script error")+". Make sure every file was uploaded to GitHub, then hard refresh.";document.body.appendChild(d)});</script>
<div id="loginView" hidden>
  <main style="max-width:420px;padding-top:60px">
    <h1 class="pt" style="letter-spacing:6px;text-align:center">BANKER LOGIN</h1>
    <div class="panel">
      <input id="em" type="email" placeholder="Banker email" autocomplete="username">

<div id="appView" hidden>
  <header class="top"><div class="brand">BLACK BANK<small>Banker</small></div><div class="who"><span id="me"></span><button class="sm" id="ntf">Alerts</button><button class="sm" id="out">Log out</button></div></header>
  <nav class="tabs" id="tabs"></nav>
  <main id="page"></main>
</div>
<div id="toast"></div>
<script type="module">
import { db, auth, configured, doc, setDoc, increment, writeBatch, updateDoc, deleteDoc, accountKey, fmtAcct, money, gbp, RATE,
  onSnapshot, runTransaction, collection, collectionGroup, query, orderBy, where, limit, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "./firebase-init.js";
const $=id=>document.getElementById(id);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const btn=(t,c,f)=>{const b=h("button",c||"",t);if(f)b.onclick=f;return b};
const num=ph=>{const i=h("input");i.type="number";i.min="0";i.step="0.01";i.placeholder=ph;return i};
const toast=m=>{const t=$("toast");t.textContent=m;t.className="show";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",3800)};
const when=t=>new Date(t).toLocaleString([],{dateStyle:"short",timeStyle:"short"});
const STEP=5,LOANRATE=0.05;
const FEATURES=[["withdrawals","Cash withdrawals"],["deposits","Cash deposits"],["loans","Loan requests"],["upgrades","Card upgrades"],["replacements","Card replacements"],["transfers","Sending money"]];
const toP=c=>Math.round(c*RATE/100),toC=p=>Math.round(p*100/RATE);
const TIERS={"Silver":{fee:0,int:0,wd:0.05},"Silver Max":{fee:250,int:0.02,wd:0.025},"Gold":{fee:600,int:0.02,wd:0,loan:1000},"Black":{fee:1000,int:0.03,wd:0,loan:2500}};
const LT={cash_in:"Cash added",cash_out:"Cash removed",deposit:"Deposit from bank funds",to_bank:"Moved to bank funds",cash_deposit:"Cash deposit",withdrawal:"Cash withdrawal",fee:"Monthly fee",interest:"Interest paid",closed:"Account closed, balance to bank funds",loan:"Loan paid out",repayment:"Loan repayment",transfer_out:"Transfer sent",transfer_in:"Transfer received"};
let S={ok:false,funds:0,cash:0},ST={autoTransfers:false,autoMax:5000},busy=new Set(),accts=[],orders=[],reqs=[],ledger=[],accLedger=[],unsubs=[],known=null,Q="";
const watch={id:null,u:null};
const stateRef=()=>doc(db,"bank","state");
const route=()=>location.hash.slice(1)||"funds";

/* ---------- money engine: every change conserves dollars ---------- */
async function apply(ops,more){
  const dF=ops.reduce((s,o)=>s+(o.dF||0),0),dC=ops.reduce((s,o)=>s+(o.dC||0),0);
  if(!S.ok){toast("Start the new system on the Funds page first.");return false}
  if(S.funds+dF<0){toast("Not enough bank funds ("+money(S.funds)+" available).");return false}
  if(S.cash+dC<0){toast("Not enough cash in the reserve.");return false}
  const b=writeBatch(db),now=Date.now();
  ops.forEach(o=>{
    if(o.a)b.update(doc(db,"accounts",o.a.id),{balance:increment(o.dA),...(o.extra||{})});
    b.set(doc(collection(db,"ledger")),{type:o.type,acctId:o.a?o.a.id:null,name:o.a?o.a.name:"",acct:o.a?o.a.acct:"",usd:o.usd||0,fee:o.fee||0,gbp:o.gbp||0,cp:o.cp||"",at:now});
  });
  if(dF||dC)b.set(stateRef(),{funds:increment(dF),cash:increment(dC)},{merge:true});
  if(more)more(b);
  try{await b.commit();if(document.activeElement)document.activeElement.blur();draw(true);return true}
  catch(e){toast("That didn't go through. Nothing was changed.");return false}
}
const pence=i=>Math.round(parseFloat(i.value)*100);
function cashBank(sign,i){
  const p=pence(i);
  if(!(p>0))return toast("Enter an amount in £.");
  if(sign>0&&p%RATE)return toast("Cash in must be a multiple of "+RATE+"p.");
  if(sign<0&&p%STEP)return toast("Payouts must be in "+STEP+"p steps.");
  const c=toC(p);apply([{dF:sign*c,dC:sign*p,usd:c,gbp:p,type:sign>0?"cash_in":"cash_out"}]).then(ok=>{if(ok){i.value="";toast((sign>0?"Added ":"Removed ")+gbp(p)+" ("+money(c)+").")}});
}
async function cashDeposit(a,i){
  const p=pence(i);if(!(p>0))return toast("Enter an amount in £.");
  if(p%RATE)return toast("Cash in must be a multiple of "+RATE+"p.");
  const c=toC(p);if(await apply([{a,dA:c,dC:p,usd:c,gbp:p,type:"cash_deposit"}]))toast("Deposited "+money(c)+" for "+gbp(p)+".");
}
async function cashWithdraw(a,i){
  const p=pence(i);if(!(p>0))return toast("Enter an amount in £.");
  if(p%STEP)return toast("Payouts must be in "+STEP+"p steps.");
  const c=toC(p),fee=Math.round(c*(TIERS[a.tier]||TIERS.Silver).wd),debit=c+fee;
  if(debit>(a.balance||0))return toast("Not enough in the account (needs "+money(debit)+").");
  if(!confirm("Pay out "+gbp(p)+" in cash. The account is debited "+money(debit)+(fee?" including a "+money(fee)+" fee":"")+"."))return;
  if(await apply([{a,dA:-debit,dF:fee,dC:-p,usd:c,fee,gbp:p,type:"withdrawal"}]))toast("Hand over "+gbp(p)+".");
}
async function move(a,i,dir){
  const c=pence(i);if(!(c>0))return toast("Enter an amount in $.");
  if(dir<0&&c>(a.balance||0))return toast("Not enough in the account.");
  if(await apply([{a,dA:dir*c,dF:-dir*c,usd:c,type:dir>0?"deposit":"to_bank"}])){i.value="";toast("Moved "+money(c)+".")}
}
async function charge(list,kind,single){
  const m=new Date().toISOString().slice(0,7),key=kind==="fee"?"feeMonth":"intMonth";
  if(!single&&!confirm(kind==="fee"?"Take the monthly fee from every active account?":"Pay interest to every active account out of bank funds?"))return;
  if(single&&list[0][key]===m&&!confirm("Already done this month for this account. Do it again?"))return;
  const ops=[];let run=S.funds,done=0,skip=0;
  list.forEach(a=>{
    if((a.status||"active")!=="active")return;
    const T=TIERS[a.tier]||TIERS.Silver,amt=kind==="fee"?T.fee:Math.round((a.balance||0)*T.int);
    if(!(amt>0))return;
    if(a[key]===m&&!single){done++;return}
    if(kind==="fee"){if((a.balance||0)<amt){skip++;return}ops.push({a,dA:-amt,dF:amt,usd:amt,type:"fee",extra:{feeMonth:m}})}
    else{if(amt>run){skip++;return}run-=amt;ops.push({a,dA:amt,dF:-amt,usd:amt,type:"interest",extra:{intMonth:m}})}
  });
  const tail=(done?" "+done+" already done this month.":"")+(skip?" "+skip+" skipped ("+(kind==="fee"?"balance too low":"not enough bank funds")+").":"");
  if(!ops.length)return toast("Nothing to do."+tail);
  const tot=ops.reduce((s,o)=>s+o.usd,0);
  if(await apply(ops))toast((kind==="fee"?"Took ":"Paid ")+money(tot)+" across "+ops.length+" account(s)."+tail);
}
async function start(){
  if(!confirm("Set every account and the bank funds to $0.00 and the cash reserve to £0.00? This can't be undone."))return;
  const b=writeBatch(db);
  accts.forEach(a=>b.update(doc(db,"accounts",a.id),{balance:0,feeMonth:null,intMonth:null}));
  b.set(stateRef(),{funds:0,cash:0,started:Date.now()});
  try{await b.commit();toast("The new system is live.")}catch(e){toast("Couldn't start the system.")}
}

/* ---------- orders, requests, accounts admin ---------- */
const setOrder=(o,s)=>updateDoc(doc(db,"orders",o.id),{status:s}).catch(()=>toast("Couldn't update the order."));
async function deliver(o){
  try{
    let acct;
    do{acct=String(crypto.getRandomValues(new Uint32Array(1))[0]%10000).padStart(4,"0")+"2026"}while(accts.some(a=>a.acct===acct));
    await setDoc(doc(db,"accounts",await accountKey(acct,o.pin)),{acct,name:o.name,tier:o.tier,balance:0,created:Date.now(),status:"active"});
    await updateDoc(doc(db,"orders",o.id),{status:"delivered",acct});toast("Account "+fmtAcct(acct)+" opened.");
  }catch(e){toast("Couldn't open the account.")}
}
function resolve(r,status){
  const b=writeBatch(db);
  b.update(doc(db,"accounts",r.acctId,"requests",r.id),{status});
  if(status==="approved"&&r.type==="upgrade")b.update(doc(db,"accounts",r.acctId),{tier:r.to});
  b.commit().catch(()=>toast("Couldn't update that request."));
}
function setStatus(a,s){updateDoc(doc(db,"accounts",a.id),{status:s}).catch(()=>toast("Couldn't change the status."))}
async function renumber(a){
  let n=prompt("New account number for "+a.name+" (digits only):",a.acct);if(n===null)return;
  n=n.replace(/\D/g,"");
  if(n.length!==8&&n.length!==16)return toast("Account numbers must be 8 digits.");
  if(n===a.acct)return;if(accts.some(x=>x.acct===n))return toast("That number is already in use.");
  const ord=orders.find(o=>o.acct===a.acct),pin=ord?ord.pin:prompt("Enter this account's PIN:");if(!pin)return;
  try{
    if(await accountKey(a.acct,pin)!==a.id)return toast("That PIN doesn't match this account.");
    if(await rekey(a,n,pin))toast("Number changed.");
  }catch(e){toast("Couldn't change the number.")}
}
/* An account's id is a hash of number + PIN, so changing either means moving it to a new id (with its history). */
async function rekey(a,acct,pin){
  const nid=await accountKey(acct,pin);
  if(nid===a.id){toast("That's the same PIN.");return false}
  if(accts.some(x=>x.id===nid)){toast("An account with that number and PIN already exists.");return false}
  const mine=reqs.filter(r=>r.acctId===a.id),hist=accLedger.filter(l=>l.acctId===a.id);
  if(2*mine.length+hist.length>440){toast("Too much history to move safely.");return false}
  const b=writeBatch(db),{id,...rest}=a,ord=orders.find(o=>o.acct===a.acct);
  b.set(doc(db,"accounts",nid),{...rest,acct});
  mine.forEach(r=>{const {id:rid,acctId,...d}=r;b.set(doc(db,"accounts",nid,"requests",rid),d);b.delete(doc(db,"accounts",a.id,"requests",rid))});
  hist.forEach(l=>b.update(doc(db,"ledger",l.id),{acctId:nid,acct}));
  if(ord)b.update(doc(db,"orders",ord.id),{pin,acct});
  b.delete(doc(db,"accounts",a.id));
  try{await b.commit();location.hash="#account/"+nid;return true}
  catch(e){toast("Couldn't move the account. Nothing was changed.");return false}
}
async function changePin(a){
  const p=prompt("New 4-digit PIN for "+a.name+":");if(p===null)return;
  if(!/^\d{4}$/.test(p.trim()))return toast("A PIN must be exactly 4 digits.");
  if(!confirm("Change "+a.name+"'s PIN? They will need the new PIN to sign in."))return;
  if(await rekey(a,a.acct,p.trim()))toast("PIN changed.");
}
async function closeAcct(a){
  const bal=a.balance||0;
  if(!confirm("Close "+a.name+"'s account and delete it permanently?"+(bal?" Its "+money(bal)+" moves to the bank funds (pay it out as cash first if they want it).":"")))return;
  const b=writeBatch(db);b.delete(doc(db,"accounts",a.id));
  if(bal&&S.ok){b.set(stateRef(),{funds:increment(bal)},{merge:true});b.set(doc(collection(db,"ledger")),{type:"closed",acctId:a.id,name:a.name,acct:a.acct,usd:bal,fee:0,gbp:0,at:Date.now()})}
  try{await b.commit();location.hash="#accounts";toast("Account closed.")}catch(e){toast("Couldn't close the account.")}
}

/* ---------- loan approval ---------- */
function loanModal(r,a){
  const amt=r.amount||0,max=(TIERS[a.tier]||{}).loan||0,bad=[];
  if(!S.ok)bad.push("Start the new system on the Funds page first.");
  if(!max)bad.push("A "+a.tier+" card isn't eligible for loans.");
  else if(amt>max)bad.push("This is over the "+a.tier+" limit of "+money(max)+".");
  if((a.status||"active")!=="active")bad.push("This account is "+a.status+".");
  if(amt>S.funds)bad.push("The bank funds only hold "+money(S.funds)+".");
  if((a.loanOwed||0)>0)bad.push("This account already has an active loan ("+money(a.loanOwed)+" owed).");
  const bg=h("div","mbg"),m=h("div","modal"),close=()=>bg.remove();
  bg.onclick=e=>{if(e.target===bg)close()};
  m.append(h("div","kick","Loan approval"),h("h2","","Approve a loan of "+money(amt)+"?"));
  [["Borrower",a.name+" · "+fmtAcct(a.acct)],["Card",a.tier+" (limit "+money(max)+")"],["To be repaid (5% interest)",money(Math.round(amt*(1+LOANRATE)))],["Bank funds",money(S.funds)+" → "+money(S.funds-amt)],["Their balance",money(a.balance||0)+" → "+money((a.balance||0)+amt)]]
    .forEach(([k,v])=>{const row=h("div","mrow");row.append(h("span","",k),h("strong","",v));m.append(row)});
  if(bad.length){bad.forEach(t=>m.append(h("div","mbad","✕ "+t)));const row=h("div","row");row.append(btn("Close","ghost",close));m.append(row)}
  else{
    m.append(h("p","hint","This moves "+money(amt)+" out of the bank funds and straight into "+a.name+"'s account. It is recorded in the ledger and cannot be undone."));
    const lab=h("label","ack"),cb=h("input");cb.type="checkbox";lab.append(cb,h("span","","I understand and approve this loan"));m.append(lab);
    const go=btn("Approve & pay out",null,async()=>{
      go.disabled=true;
      const ok=await apply([{a,dA:amt,dF:-amt,usd:amt,type:"loan",extra:{loanOwed:Math.round(amt*(1+LOANRATE)),loanPrincipal:amt,loanAt:Date.now()}}],b=>b.update(doc(db,"accounts",r.acctId,"requests",r.id),{status:"approved"}));
      if(ok){close();toast("Loan of "+money(amt)+" paid to "+a.name+".")}else go.disabled=false;
    });
    go.disabled=true;cb.onchange=()=>{go.disabled=!cb.checked};
    const row=h("div","row");row.append(btn("Cancel","ghost",close),go);m.append(row);
  }
  bg.append(m);document.body.append(bg);
}

/* ---------- automatic transfer approval (runs while this page is open) ---------- */
const saveAuto=patch=>setDoc(doc(db,"bank","settings"),{autoTransfers:ST.autoTransfers,autoMax:ST.autoMax,...patch},{merge:true}).then(()=>toast("Saved.")).catch(()=>toast("Couldn't save that."));
function transferProblems(r,a,to){
  const amt=r.amount||0,bad=[];
  if(!to||to.id===a.id)bad.push("recipient");
  else{if((to.status||"active")!=="active")bad.push("recipient status");if(to.locks&&to.locks.deposits)bad.push("recipient lock")}
  if((a.status||"active")!=="active"||(a.locks&&a.locks.transfers))bad.push("sender");
  if(!(amt>0)||amt>(a.balance||0))bad.push("funds");
  return bad;
}
function autoProcess(){
  if(!ST.autoTransfers||!S.ok)return;
  reqs.filter(r=>r.type==="transfer"&&r.status==="pending"&&!busy.has(r.id)).forEach(r=>{
    const a=accts.find(x=>x.id===r.acctId),to=accts.find(x=>x.acct===r.toAcct);
    if(a&&to&&(r.amount||0)<=ST.autoMax&&!transferProblems(r,a,to).length)autoTransfer(r,a,to);
  });
}
async function autoTransfer(r,a,to){
  busy.add(r.id);
  try{
    const ok=await runTransaction(db,async tx=>{
      const rr=doc(db,"accounts",r.acctId,"requests",r.id),sr=doc(db,"accounts",a.id),tr=doc(db,"accounts",to.id);
      const [rs,ss,ts]=await Promise.all([tx.get(rr),tx.get(sr),tx.get(tr)]);
      if(!rs.exists()||rs.data().status!=="pending"||!ss.exists()||!ts.exists())return false;
      const q=rs.data(),A={id:sr.id,...ss.data()},T={id:tr.id,...ts.data()};
      if(q.toAcct!==T.acct||(q.amount||0)>ST.autoMax||transferProblems(q,A,T).length)return false;

async function repay(a,c,r){
  const owed=a.loanOwed||0;
  if((a.status||"active")!=="active")return toast("This account isn't active.");
  if(!(c>0)||c>owed)return toast("Enter an amount up to "+money(owed)+".");
  if(c>(a.balance||0))return toast("Not enough in the account ("+money(a.balance||0)+").");
  const left=owed-c;
  const more=r?(b=>b.update(doc(db,"accounts",r.acctId,"requests",r.id),{status:"approved"})):null;
  if(await apply([{a,dA:-c,dF:c,usd:c,type:"repayment",extra:{loanOwed:left,...(left?{}:{loanPrincipal:0})}}],more))
    toast("Repayment of "+money(c)+" recorded."+(left?" "+money(left)+" still owed.":" The loan is fully repaid."));
}
