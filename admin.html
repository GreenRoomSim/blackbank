<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Banker | Black Bank</title>
<style>
:root{--bg:#070708;--card:#111114;--ink:#f4f1ea;--mute:#8d8a82;--line:#2a2a2e;--accent:#c9a24b;--accent-ink:#0b0b0c;--ok:#6fcf97;--warn:#c9a24b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header,main{max-width:760px;margin:0 auto;padding:16px}
header{padding-top:24px;padding-bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:1.4rem;letter-spacing:6px;font-weight:600;font-family:Georgia,'Times New Roman',serif;text-transform:uppercase}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;margin-top:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.danger{background:transparent;color:#c0392b;border:1px solid var(--line)}
.tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.order{border-top:1px solid var(--line);padding:12px 0}
.order:first-child{border-top:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.meta{color:var(--mute);font-size:.88rem;margin-top:2px}
.pill{font-size:.75rem;padding:3px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.s-ordered{color:var(--warn)}.s-preparing{color:var(--accent)}.s-delivered{color:var(--ok)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:rgba(201,162,75,.3)}to{background:transparent}}
.err{color:#c0392b;font-size:.9rem;margin-top:8px;min-height:1.2em}
.empty,.live{color:var(--mute);font-size:.9rem}
</style>
</head>
<body>
<div id="loginView" hidden>
  <main style="max-width:420px">
    <h1>Banker login</h1>
    <div class="panel">
      <input id="em" type="email" placeholder="Banker email" autocomplete="username">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <div style="margin-top:12px"><button id="go" style="width:100%">Log in</button></div>
      <div class="err" id="err"></div>
    </div>
  </main>
</div>

<div id="appView" hidden>
  <header>
    <h1>Incoming orders</h1>
    <div>
      <span class="live" id="live">connecting…</span>
      <button class="ghost" id="snd">🔔 Sound off</button>
      <button class="ghost" id="ntf">Enable alerts</button>
      <button class="ghost" id="out">Log out</button>
    </div>
  </header>
  <main>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="list"></div>
    <h2 style="margin:22px 0 0;font-size:1.1rem">Bank funds</h2>
    <div class="panel">
      <strong id="funds" style="font-size:1.8rem;color:var(--accent)">£0.00</strong>
      <div class="meta">Monthly and withdrawal fees go in. Interest comes out.</div>
      <div class="actions"><input id="fa" type="number" min="0" step="0.01" placeholder="Amount £" style="width:130px;margin:0"><button id="fadd">Add funds</button><button class="ghost" id="frem">Remove funds</button></div>
      <div class="actions" style="margin-top:16px"><button id="feeAll">Take Monthly Fee (all)</button><button class="ghost" id="intAll">Add Interest (all)</button></div>
    </div>
    <h2 style="margin:22px 0 0;font-size:1.1rem">Accounts</h2>
    <div class="panel"><input id="q" placeholder="Search by name or account number" autocomplete="off" style="margin:0 0 6px"><div id="accts"></div></div>
  </main>
</div>

<script>window.addEventListener("error",function(e){var d=document.createElement("div");d.style.cssText="padding:24px;color:#e0a89c;font-family:system-ui;line-height:1.5";d.textContent="This page couldn't load: "+(e.message||"script error")+". Make sure every file was uploaded to GitHub, then hard refresh.";document.body.appendChild(d)});</script>
<script type="module">
import { db, auth, configured, doc, setDoc, increment, writeBatch, updateDoc, deleteDoc, accountKey, fmtAcct, money, onSnapshot, collection, query, orderBy,
         signInWithEmailAndPassword, onAuthStateChanged, signOut } from "./firebase-init.js";

const $=id=>document.getElementById(id);
const LABEL={ordered:"New",preparing:"Preparing",delivered:"Delivered"};
let orders=[], known=null, filter="todo", ctx=null, soundOn=false, unsub=null;

/* ---------- sound + notifications ---------- */
function beep(){
  if(!soundOn||!ctx)return;
  try{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=880;g.gain.value=.15;
    o.connect(g);g.connect(ctx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);o.stop(ctx.currentTime+.5);
  }catch(e){}
}
$("snd").onclick=()=>{
  soundOn=!soundOn;
  if(soundOn&&!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(soundOn&&ctx&&ctx.state==="suspended")ctx.resume();
  $("snd").textContent=soundOn?"🔔 Sound on":"🔔 Sound off";
  if(soundOn)beep();
};
$("ntf").onclick=()=>{
  if(!("Notification" in window)){$("ntf").textContent="Not supported";return}
  Notification.requestPermission().then(p=>{$("ntf").textContent=p==="granted"?"Alerts on":"Alerts blocked"});
};
function notify(o){
  if("Notification" in window&&Notification.permission==="granted"){
    try{new Notification("New card order",{body:o.tier+" card for "+o.name+" → "+o.room})}catch(e){}
  }
}

/* ---------- actions ---------- */
const setStatus=(id,status)=>updateDoc(doc(db,"orders",id),{status}).catch(()=>alert("Couldn't update that order."));
const remove=id=>{if(confirm("Delete this order?"))deleteDoc(doc(db,"orders",id)).catch(()=>alert("Couldn't delete."))};

/* ---------- drawing ---------- */
function drawTabs(){
  const box=$("tabs");box.textContent="";
  const todo=orders.filter(o=>o.status!=="delivered").length;
  [["todo","To do ("+todo+")"],["all","All ("+orders.length+")"],["delivered","Delivered"]].forEach(([k,label])=>{
    const b=document.createElement("button");b.textContent=label;
    if(k===filter)b.className="on";
    b.onclick=()=>{filter=k;draw()};
    box.appendChild(b);
  });
}
function draw(fresh=[]){
  drawTabs();
  const box=$("list");box.textContent="";
  const rows=orders.filter(o=>filter==="all"||(filter==="todo"?o.status!=="delivered":o.status==="delivered"));
  if(!rows.length){
    const e=document.createElement("div");e.className="empty";
    e.textContent=filter==="todo"?"No orders waiting. 🎉":"Nothing here.";
    box.appendChild(e);return;
  }
  rows.forEach(o=>{
    const el=document.createElement("div");el.className="order"+(fresh.includes(o.id)?" new":"");
    const r=document.createElement("div");r.className="row";
    const t=document.createElement("strong");t.textContent=o.tier+" card for "+o.name;
    const p=document.createElement("span");p.className="pill s-"+o.status;p.textContent=LABEL[o.status]||o.status;
    r.append(t,p);el.appendChild(r);
    const m=document.createElement("div");m.className="meta";
    m.textContent="Deliver to: "+o.room+" · "+new Date(o.at).toLocaleString([],{dateStyle:"short",timeStyle:"short"});
    el.appendChild(m);
    if(o.note){const n=document.createElement("div");n.className="meta";n.textContent="Note: "+o.note;el.appendChild(n)}
    if(o.pin){const q=document.createElement("div");q.className="meta";q.textContent="PIN: "+o.pin+(o.acct?"  ·  Account: "+fmtAcct(o.acct):"");el.appendChild(q)}
    const ac=document.createElement("div");ac.className="actions";
    if(o.status==="ordered"){const b=document.createElement("button");b.className="ghost";b.textContent="Start preparing";b.onclick=()=>setStatus(o.id,"preparing");ac.appendChild(b)}
    if(o.status!=="delivered"){const b=document.createElement("button");b.textContent="Deliver & open account";b.onclick=()=>deliver(o);ac.appendChild(b)}
    const d=document.createElement("button");d.className="danger";d.textContent="Delete";d.onclick=()=>remove(o.id);ac.appendChild(d);
    el.appendChild(ac);box.appendChild(el);
  });
}

/* ---------- accounts ---------- */
let accts=[],unsubA=null;
async function deliver(o){
  try{
    let acct;
    do{acct=String(crypto.getRandomValues(new Uint32Array(1))[0]%10000).padStart(4,"0")+"2026"}while(accts.some(a=>a.acct===acct));
    await setDoc(doc(db,"accounts",await accountKey(acct,o.pin)),{acct,name:o.name,tier:o.tier,balance:0,created:Date.now()});
    await updateDoc(doc(db,"orders",o.id),{status:"delivered",acct});
  }catch(e){alert("Couldn't open the account.")}
}
function adjust(a,sign,input){
  const p=Math.round(parseFloat(input.value)*100);
  if(!(p>0))return;
  const fee=sign<0?Math.round(p*((TIERS[a.tier]||{}).wd||0)):0,total=p+fee;
  if(sign<0&&total>a.balance){alert("Not enough funds"+(fee?" (a "+money(fee)+" withdrawal fee applies).":"."));return}
  if(fee&&!confirm("Withdraw "+money(p)+"? "+a.tier+" withdrawal fee: "+money(fee)+". The account is debited "+money(total)+"."))return;
  const b=writeBatch(db);
  b.update(doc(db,"accounts",a.id),{balance:increment(sign*total)});
  if(fee)b.set(fundsRef(),{balance:increment(fee)},{merge:true});
  b.commit().then(()=>{input.value=""}).catch(()=>alert("Couldn't update the balance."));
}
/* ---------- bank funds, fees, interest ---------- */
const TIERS={"Silver":{fee:0,int:0,wd:0.05},"Silver Max":{fee:250,int:0.02,wd:0.025},"Gold":{fee:600,int:0.02,wd:0},"Black":{fee:1000,int:0.03,wd:0}};
let funds=0,unsubF=null;
const mk=()=>new Date().toISOString().slice(0,7);
const fundsRef=()=>doc(db,"bank","funds");
function listenFunds(){
  if(unsubF)unsubF();
  unsubF=onSnapshot(fundsRef(),s=>{funds=s.exists()?(s.data().balance||0):0;$("funds").textContent=money(funds)},()=>{});
}
function adjustFunds(sign){
  const p=Math.round(parseFloat($("fa").value)*100);
  if(!(p>0))return;
  if(sign<0&&p>funds){alert("The bank doesn't have that much.");return}
  setDoc(fundsRef(),{balance:increment(sign*p)},{merge:true}).then(()=>{$("fa").value=""}).catch(()=>alert("Couldn't update bank funds."));
}
async function takeFee(list){
  const m=mk(),single=list!==accts;let force=false;
  if(single&&list[0].feeMonth===m){if(!confirm("This account was already charged this month. Charge again?"))return;force=true}
  if(!single&&!confirm("Take the monthly fee from every active account?"))return;
  const b=writeBatch(db);let total=0,n=0,done=0,broke=0;
  list.forEach(a=>{
    const fee=(TIERS[a.tier]||{}).fee||0;
    if(!fee||(a.status||"active")!=="active")return;
    if(a.feeMonth===m&&!force){done++;return}
    if(a.balance<fee){broke++;return}
    b.update(doc(db,"accounts",a.id),{balance:increment(-fee),feeMonth:m});total+=fee;n++;
  });
  if(n){b.set(fundsRef(),{balance:increment(total)},{merge:true});try{await b.commit()}catch(e){return alert("Couldn't take the fees.")}}
  alert((n?"Took "+money(total)+" from "+n+" account(s).":"Nothing to take.")+(done?" "+done+" already charged this month.":"")+(broke?" "+broke+" couldn't afford it.":""));
}
async function addInterest(list){
  const m=mk(),single=list!==accts;let force=false;
  if(single&&list[0].intMonth===m){if(!confirm("Interest was already added to this account this month. Add again?"))return;force=true}
  if(!single&&!confirm("Pay interest to every active account out of bank funds?"))return;
  const b=writeBatch(db);let total=0,n=0,done=0,short=0;
  list.forEach(a=>{
    const amt=Math.round(a.balance*((TIERS[a.tier]||{}).int||0));
    if(amt<=0||(a.status||"active")!=="active")return;
    if(a.intMonth===m&&!force){done++;return}
    if(total+amt>funds){short++;return}
    b.update(doc(db,"accounts",a.id),{balance:increment(amt),intMonth:m});total+=amt;n++;
  });
  if(n){b.set(fundsRef(),{balance:increment(-total)},{merge:true});try{await b.commit()}catch(e){return alert("Couldn't add interest.")}}
  alert((n?"Paid "+money(total)+" to "+n+" account(s).":"Nothing to pay.")+(done?" "+done+" already paid this month.":"")+(short?" "+short+" skipped: not enough bank funds.":""));
}
function closeAcct(a){
  if(!confirm("Close "+a.name+"'s account? "+(a.balance>0?"Its "+money(a.balance)+" balance should be paid out first. ":"")+"This permanently deletes it."))return;
  deleteDoc(doc(db,"accounts",a.id)).catch(()=>alert("Couldn't close the account."));
}
$("fadd").onclick=()=>adjustFunds(1);$("frem").onclick=()=>adjustFunds(-1);
$("feeAll").onclick=()=>takeFee(accts);$("intAll").onclick=()=>addInterest(accts);

function setAcctStatus(a,s){
  if(s==="closed"&&!confirm("Close this account?")){drawAccts();return}
  updateDoc(doc(db,"accounts",a.id),{status:s}).catch(()=>alert("Couldn't change the status."));
}
async function renumber(a){
  let n=prompt("New account number for "+a.name+" (digits only):",a.acct);
  if(n===null)return;
  n=n.replace(/\D/g,"");
  if(n.length!==8&&n.length!==16)return alert("Account numbers must be 8 digits.");
  if(n===a.acct)return;
  if(accts.some(x=>x.acct===n))return alert("That number is already in use.");
  const ord=orders.find(o=>o.acct===a.acct);
  const pin=ord?ord.pin:prompt("Enter this account's PIN:");
  if(!pin)return;
  try{
    if(await accountKey(a.acct,pin)!==a.id)return alert("That PIN doesn't match this account.");
    const {id,...rest}=a;
    await setDoc(doc(db,"accounts",await accountKey(n,pin)),{...rest,acct:n});
    if(ord)await updateDoc(doc(db,"orders",ord.id),{acct:n});
    await deleteDoc(doc(db,"accounts",a.id));
  }catch(e){alert("Couldn't change the number.")}
}
function drawAccts(){
  const q=$("q").value.trim().toLowerCase(),qd=q.replace(/\D/g,""),box=$("accts");box.textContent="";
  const rows=accts.filter(a=>!q||a.name.toLowerCase().includes(q)||(qd&&a.acct.includes(qd)));
  if(!rows.length){const e=document.createElement("div");e.className="empty";e.textContent=accts.length?"No match.":"No accounts yet. They're created when you deliver a card.";box.appendChild(e);return}
  rows.forEach(a=>{
    const el=document.createElement("div");el.className="order";
    const r=document.createElement("div");r.className="row";
    const t=document.createElement("strong");t.textContent=a.name+" · "+a.tier+((a.status&&a.status!=="active")?" · "+a.status.toUpperCase():"");
    const bal=document.createElement("strong");bal.textContent=money(a.balance);
    r.append(t,bal);el.appendChild(r);
    const m=document.createElement("div");m.className="meta";m.textContent=fmtAcct(a.acct);el.appendChild(m);
    const ac=document.createElement("div");ac.className="actions";
    const i=document.createElement("input");i.type="number";i.min="0";i.step="0.01";i.placeholder="Amount £";i.style.cssText="width:130px;margin:0";
    const d=document.createElement("button");d.textContent="Deposit";d.onclick=()=>adjust(a,1,i);
    const w=document.createElement("button");w.className="ghost";w.textContent="Withdraw";w.onclick=()=>adjust(a,-1,i);
    const live=(a.status||"active")==="active";i.disabled=d.disabled=w.disabled=!live;
    ac.append(i,d,w);el.appendChild(ac);
    const a2=document.createElement("div");a2.className="actions";
    const sel=document.createElement("select");sel.style.cssText="font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px";
    [["active","Active"],["frozen","Frozen"],["locked","Locked"]].forEach(([v,l])=>{const op=document.createElement("option");op.value=v;op.textContent=l;if(v===(a.status||"active"))op.selected=true;sel.appendChild(op)});
    sel.onchange=()=>setAcctStatus(a,sel.value);
    const nb=document.createElement("button");nb.className="ghost";nb.textContent="Change number";nb.onclick=()=>renumber(a);
    const cl=document.createElement("button");cl.className="danger";cl.textContent="Close account";cl.onclick=()=>closeAcct(a);
    a2.append(sel,nb,cl);
    const a3=document.createElement("div");a3.className="actions";
    const fb=document.createElement("button");fb.textContent="Take Monthly Fee";fb.onclick=()=>takeFee([a]);
    const ib=document.createElement("button");ib.className="ghost";ib.textContent="Add Interest";ib.onclick=()=>addInterest([a]);
    fb.disabled=ib.disabled=!live;a3.append(fb,ib);
    el.append(a3,a2);box.appendChild(el);
  });
}
$("q").oninput=drawAccts;
function listenAccts(){
  if(unsubA)unsubA();
  unsubA=onSnapshot(collection(db,"accounts"),snap=>{
    accts=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created);
    if(document.activeElement&&document.activeElement.type==="number")return;
    drawAccts();
  },()=>{});
}

/* ---------- live data ---------- */
function listen(){
  if(unsub)unsub();
  known=null;
  unsub=onSnapshot(query(collection(db,"orders"),orderBy("at","desc")),snap=>{
    $("live").textContent="● live";
    const list=snap.docs.map(d=>({id:d.id,...d.data()}));
    const fresh=known?list.filter(o=>!known.has(o.id)):[];
    known=new Set(list.map(o=>o.id));
    orders=list;draw(fresh.map(o=>o.id));
    if(fresh.length){
      beep();fresh.forEach(notify);
      document.title="("+fresh.length+") New order! | Black Bank";
      setTimeout(()=>{document.title="Banker | Black Bank"},4000);
    }
  },err=>{
    if(err.code==="permission-denied"){
      $("err").textContent="That account isn't the banker account.";
      signOut(auth);
    }else{$("live").textContent="reconnecting…"}
  });
}

/* ---------- login ---------- */
function showApp(){$("loginView").hidden=true;$("appView").hidden=false;listen();listenAccts();listenFunds()}
function showLogin(){if(unsub){unsub();unsub=null}if(unsubA){unsubA();unsubA=null}if(unsubF){unsubF();unsubF=null}$("appView").hidden=true;$("loginView").hidden=false}
async function login(){
  $("err").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value);$("pw").value=""}
  catch(e){$("err").textContent="Wrong email or password."}
}
$("go").onclick=login;
$("pw").onkeydown=e=>{if(e.key==="Enter")login()};
$("out").onclick=()=>signOut(auth);

if(!configured){
  showLogin();$("go").disabled=true;
  $("err").textContent="Not set up yet: add your Firebase settings (see SETUP.md).";
}else{
  onAuthStateChanged(auth,u=>{u?showApp():showLogin()});
}
</script>
<script src="nav.js"></script>
</body>
</html>
